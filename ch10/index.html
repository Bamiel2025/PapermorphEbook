<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alimentation, digestion & santé — Ebook SVT Cycle 4</title>
<link rel="stylesheet" href="../lib/engine.css">

<body>
<script src="../lib/engine.js"></script>
<script src="../lib/lang-fr.js"></script>
<script src="../lib/vocab.js"></script>
<script src="audio/fr/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 10, title: 'Alimentation, digestion & santé', minutes: 5, language: 'fr', next: '../ch11/' };

const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

const BEATS = [
  ['intro', 'TOPIC', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'SVT · Cycle 4 · Chapitre 3.2', { x: 800, y: 290, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Alimentation, digestion', { x: 800, y: 420, size: 74, weight: 600, anchor: 'middle' });
    T(g, '& santé', { x: 800, y: 510, size: 74, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const v = vxVirus(g, 1180, 300, 42, C_VIRUS);
    show(v, 1, .6);
    const r = text(scene, 'Comment les aliments deviennent-ils des nutriments pour nos cellules ?', 800, 660, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(v, D - .9, .8);
  }],
  ['probleme', 'Du repas à la cellule', (m) => {
    const p = panel(0);
    const card = mk('rect', { x: 110, y: 170, width: 880, height: 560, rx: 22, fill: COL.board, stroke: COL.faint, 'stroke-width': 2, opacity: 0 }, p);
    show(card, .1, .5);
    text(p, 'Chapitre 3.2 — Alimentation, digestion & santé', 160, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    ['« Chaque jour, nous mangeons des aliments (pain, fruits, viande).', 'Comment notre corps les transforme-t-il en', 'minuscules éléments nutritifs capables de passer', 'dans le sang pour nourrir nos cellules ? »'].forEach((l, i) => text(p, l, 160, 320 + i * 56, .5 + i * .25, { size: 36, fill: COL.chalk }));
    text(p, 'Bouche → Estomac → Intestin grêle', 1050, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'mécanique + chimique (enzymes)', 1050, 290, .45, { size: 24, fill: C_VIRUS, weight: 700 });
    text(p, 'Absorption :', 1050, 350, .7, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'villosités de l’intestin grêle', 1050, 400, .9, { size: 28, fill: C_SEUIL, weight: 700 });
    const tx = G(p, { o: 0 });
    mk('circle', { cx: 1090, cy: 560, r: 14, fill: C_VIRUS }, tx);
    T(tx, 'Microbiote intestinal', { x: 1122, y: 569, size: 30, fill: C_VIRUS, weight: 700 });
    T(tx, 'bonnes bactéries indispensables', { x: 1122, y: 615, size: 26, fill: COL.dim });
    show(tx, m('start'), .6);
    text(p, 'La salive contient déjà une enzyme qui digère l’amidon.', 160, 640, 1.2, { size: 27, fill: COL.dim });
  }],
  ['n1', 'Digestion mécanique et chimique', (m) => {
    const p = panel(0);
    text(p, 'Des aliments aux nutriments', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, 'Bouche', 'dents coupent et broient', C_VIRUS, m('a'));
    pnum(p, 970, 260, 'Estomac + intestin', 'sucs digestifs + enzymes', C_VAC, m('b'));
    text(p, 'Les enzymes découpent les gros morceaux d’aliments en éléments microscopiques : les nutriments (glucose, acides aminés).', 800, 470, m('b', .6), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['n2', 'Absorption intestinale', (m) => {
    const p = panel(0);
    text(p, 'Le passage dans le sang', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    const row = chipsRow(p, [
      { t: 'Intestin grêle', col: C_CAS },
      { t: 'Villosités intestinales', col: C_SEUIL },
      { t: 'Surface ≈ 300 m² (terrain de tennis)', col: C_EXTRA }
    ], 260, 330, { size: 26, gap: 80 });
    chipsIn(row, 0, m('c')); chipsIn(row, 1, m('c', .7)); chipsIn(row, 2, m('d'));
    text(p, 'Les nutriments absorbés sont distribués par le sang à tous les organes.', 800, 520, m('d', .9), { size: 28, fill: COL.dim, anchor: 'middle' });
    text(p, 'Ce qui n’est pas digéré (fibres) passe dans le gros intestin.', 800, 566, m('d', 1.2), { size: 28, fill: COL.dim, anchor: 'middle' });
  }],
  ['retenir', 'À retenir (B.O.)', (m) => {
    const p = panel(0);
    text(p, 'Le cœur du chapitre', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, 'Digestion', 'aliments + broyage + enzymes', C_VIRUS, m('r1'));
    pnum(p, 970, 260, 'Absorption', 'nutriments solubles → sang', C_SEUIL, m('r2'));
    text(p, 'Le microbiote intestinal et une alimentation équilibrée sont essentiels pour rester en bonne santé.', 800, 470, m('r2', .6), { size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['savoir', 'Le saviez-vous ?', (m) => {
    const p = panel(0);
    text(p, '~300 m² de surface', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    const n = T(p, 'd’échange', { x: 800, y: 400, size: 44, fill: C_VIRUS, anchor: 'middle', weight: 700, o: 0 });
    put(n, { s: .2 }); pop(n, m('s'));
    text(p, 'grâce aux replis et villosités de l’intestin grêle.', 800, 500, m('s', .6), { size: 30, fill: COL.dim, anchor: 'middle' });
  }],
  ['wrap', 'Bilan du chapitre', (m) => {
    const p = panel(0);
    [['La digestion transforme les aliments en nutriments solubles grâce aux actions mécaniques et chimiques (enzymes).', 'w1'],
     ['L’absorption intestinale se déroule au niveau des villosités de l’intestin grêle.', 'w2'],
     ['Les nutriments passent dans le sang pour nourrir toutes les cellules du corps.', 'w3'],
     ['Le microbiote intestinal et une alimentation équilibrée sont essentiels pour rester en bonne santé.', 'w4']].forEach(([str, mk_], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mk_), .6);
    });
  }],
  ['q1', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'c-absorption', prompt: ['Dans quel organe du tube digestif la quasi-totalité des nutriments passe-t-elle dans le sang ?'],
      build: choice([['Dans la bouche.'], ['Dans l’œsophage.'], ['Dans l’intestin grêle (au niveau des villosités).'], ['Dans la vésicule biliaire.']], 2,
        'L’intestin grêle présente une immense surface d’échange plissée en villosités, optimisée pour le passage des nutriments dans le sang.',
        [null, 'La bouche broie et commence la digestion, mais n’absorbe presque rien.', "L’œsophage ne fait que transporter le bol alimentaire.", 'La vésicule biliaire stocke la bile, elle n’absorbe pas les nutriments.']) },
  ], done) }],
  ['q2', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'c-enzymes', prompt: ['Les enzymes digestives transforment chimiquement les grosses molécules alimentaires en petits nutriments solubles.'],
      build: choice([['VRAI'], ['FAUX']], 0,
        'Vrai : c’est la définition exacte de la digestion chimique enzymatique (ex. amylase, protéases, lipases).',
        [null, 'Les enzymes agissent comme des ciseaux moléculaires.', 'Elles coupent les aliments en nutriments solubles.']) },
  ], done) }],
  ['finish', 'Terminé', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
