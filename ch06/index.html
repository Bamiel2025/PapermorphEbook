<html lang="fr">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../lib/engine.css">

<script src="../lib/engine.js"></script>
<script src="../lib/lang-fr.js"></script>

<script>
'use strict';
const CHAPTER = { number: 6, title: 'Reproduction & dynamisme des populations', minutes: 5, language: 'fr', next: '../ch07/' };

const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

const BEATS = [
  ['intro', 'TOPIC', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'SVT · Cycle 4 · Chapitre 2.2', { x: 800, y: 290, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Reproduction', { x: 800, y: 420, size: 84, weight: 600, anchor: 'middle' });
    T(g, '& dynamisme des populations', { x: 800, y: 520, size: 64, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const v = vxVirus(g, 1180, 300, 42, C_VIRUS);
    show(v, 1, .6);
    const r = text(scene, 'Deux grands modes : sexuée et asexuée.', 800, 660, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(v, D - .9, .8);
  }],
  ['probleme', 'Deux modes de reproduction', (m) => {
    const p = panel(0);
    const card = mk('rect', { x: 110, y: 170, width: 880, height: 560, rx: 22, fill: COL.board, stroke: COL.faint, 'stroke-width': 2, opacity: 0 }, p);
    show(card, .1, .5);
    text(p, 'Chapitre 2.2 — Reproduction & dynamisme des populations', 160, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    ['« Pour assurer la survie de leur espèce,', 'les êtres vivants se reproduisent.', 'Il existe deux grands modes', 'de reproduction dans la nature :', 'la reproduction sexuée et la reproduction asexuée. »'].forEach((l, i) => text(p, l, 160, 300 + i * 52, .5 + i * .25, { size: 34, fill: COL.chalk }));
    text(p, 'Reproduction sexuée :', 1050, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'gamète mâle + gamète femelle', 1050, 290, .45, { size: 28, fill: C_VIRUS, weight: 700 });
    text(p, '→ fécondation → cellule-œuf', 1050, 340, .7, { size: 28, fill: C_VIRUS, weight: 700 });
    text(p, 'Reproduction asexuée :', 1050, 400, .9, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'un seul parent → clones très rapides', 1050, 460, 1.1, { size: 24, fill: C_SEUIL, weight: 700 });
    const tx = G(p, { o: 0 });
    mk('circle', { cx: 1090, cy: 560, r: 14, fill: C_VIRUS }, tx);
    T(tx, 'Graines dispersées', { x: 1122, y: 569, size: 30, fill: C_VIRUS, weight: 700 });
    T(tx, 'par le vent, les animaux ou l’eau', { x: 1122, y: 615, size: 26, fill: COL.dim });
    show(tx, m('start'), .6);
    text(p, 'La fécondation peut être externe (dans l’eau) ou interne (mammifères, oiseaux, insectes).', 160, 640, 1.2, { size: 27, fill: COL.dim });
  }],
  ['n1', 'Reproduction sexuée', (m) => {
    const p = panel(0);
    text(p, 'Gamètes et fécondation', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, 'Gamète mâle +', 'gamète femelle', C_VIRUS, m('a'));
    pnum(p, 970, 260, 'Fécondation', '→ cellule-œuf unique', C_VAC, m('b'));
    text(p, 'Fécondation externe (dans l’eau : oursin, truite) ou interne (mammifères, oiseaux, insectes).', 800, 470, m('b', .6), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['n2', 'Reproduction asexuée', (m) => {
    const p = panel(0);
    text(p, 'Se multiplier sans partenaire', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    const row = chipsRow(p, [
      { t: 'Un seul parent, pas de fécondation', col: C_VIRUS },
      { t: 'Individus génétiquement identiques', col: C_CAS },
      { t: 'Stolons, tubercules, bouturage', col: C_EXTRA }
    ], 260, 330, { size: 27, gap: 80 });
    chipsIn(row, 0, m('c')); chipsIn(row, 1, m('c', .7)); chipsIn(row, 2, m('d'));
    text(p, 'Le fraisier produit des stolons qui s’enracinent ;', 800, 520, m('d', .9), { size: 28, fill: COL.dim, anchor: 'middle' });
    text(p, 'l’hydre se multiplie par bourgeonnement.', 800, 566, m('d', 1.2), { size: 28, fill: COL.dim, anchor: 'middle' });
  }],
  ['retenir', 'À retenir (B.O.)', (m) => {
    const p = panel(0);
    text(p, 'Le cœur du chapitre', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, 'Sexuée', '2 gamètes → 1 cellule-œuf', C_VAC, m('r1'));
    pnum(p, 970, 260, 'Asexuée', '1 parent → clones rapides', C_SEUIL, m('r2'));
    text(p, 'Le climat et les ressources alimentaires régulent les naissances et la survie des espèces.', 800, 470, m('r2', .6), { size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['savoir', 'Le saviez-vous ?', (m) => {
    const p = panel(0);
    text(p, 'Sexe et température du sable', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    text(p, 'Chez les tortues marines,', 800, 400, m('s'), { size: 34, fill: COL.chalk, anchor: 'middle' });
    text(p, 'la température du sable du nid détermine', 800, 454, m('s', .4), { size: 30, fill: COL.dim, anchor: 'middle' });
    text(p, 'le sexe des bébés : tiède = mâles,', 800, 494, m('s', .7), { size: 30, fill: COL.dim, anchor: 'middle' });
    text(p, 'très chaud = femelles !', 800, 534, m('s', 1), { size: 30, fill: C_VIRUS, anchor: 'middle', weight: 700 });
  }],
  ['wrap', 'Bilan du chapitre', (m) => {
    const p = panel(0);
    [['La reproduction sexuée fait intervenir deux gamètes (mâle et femelle) et une fécondation (interne ou externe).', 'w1'],
     ['La reproduction asexuée permet à un seul parent de produire rapidement des individus identiques.', 'w2'],
     ['Les plantes à fleurs dépendent des insectes et du vent pour polliniser et disséminer leurs graines.', 'w3'],
     ['Le réchauffement climatique et les activités humaines perturbent les cycles de reproduction.', 'w4']].forEach(([str, mk_], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mk_), .6);
    });
  }],
  ['q1', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(BAND, [
    { id: 'c-fecondation', prompt: ['Chez quel organisme rencontre-t-on une fécondation externe dans le milieu aquatique ?'],
      build: choice([['Le chat domestique.'], ['L’oursin de mer.'], ['L’aigle royal.'], ['Le papillon machaon.']], 1,
        'Les oursins libèrent leurs millions de gamètes directement dans l’eau de mer où a lieu la fécondation externe.',
        [null, 'Le chat est un mammifère : fécondation interne.', 'L’aigle est un oiseau : fécondation interne.', 'Le papillon féconde aussi de manière interne.']) },
  ], done) }],
  ['q2', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(BAND, [
    { id: 'c-stolon', prompt: ['La reproduction asexuée par stolon chez le fraisier fait intervenir la fabrication de pollen et de graines.'],
      build: choice([['VRAI'], ['FAUX']], 1,
        'La reproduction asexuée se fait sans gamètes ni fécondation, uniquement par développement d’une tige végétative formant un clone.',
        [null, 'Pas de gamètes, pas de fécondation en asexuée.', 'Les stolons sont des tiges de multiplication végétative sans graines.']) },
  ], done) }],
  ['finish', 'Terminé', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
