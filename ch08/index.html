<script>
'use strict';
const CHAPTER = { number: 8, title: 'Parenté & mécanismes de l’évolution', minutes: 6, language: 'fr', next: '../ch09/' };

const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

const BEATS = [
  ['intro', 'TOPIC', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'SVT · Cycle 4 · Chapitre 2.4', { x: 800, y: 290, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Parenté &', { x: 800, y: 420, size: 72, weight: 600, anchor: 'middle' });
    T(g, 'évolution', { x: 800, y: 510, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const v = vxVirus(g, 1180, 300, 42, C_VIRUS);
    show(v, 1, .6);
    const r = text(scene, 'Quels sont les indices et les mécanismes de l’évolution des espèces ?', 800, 660, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(v, D - .9, .8);
  }],
  ['probleme', 'D’où venons-nous ?', (m) => {
    const p = panel(0);
    const card = mk('rect', { x: 110, y: 170, width: 880, height: 560, rx: 22, fill: COL.board, stroke: COL.faint, 'stroke-width': 2, opacity: 0 }, p);
    show(card, .1, .5);
    text(p, 'Chapitre 2.4 — Parenté & mécanismes de l’évolution', 160, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    ['« La vie sur Terre est apparue il y a environ 3,8 milliards d’années.', 'Depuis, des millions d’espèces sont nées et ont évolué.', 'Quels sont les indices et les mécanismes', 'de l’évolution des espèces ? »'].forEach((l, i) => text(p, l, 160, 320 + i * 56, .5 + i * .25, { size: 36, fill: COL.chalk }));
    text(p, 'ADN universel et squelette', 1050, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'des tétrapodes : mêmes os.', 1050, 290, .45, { size: 28, fill: COL.dim });
    text(p, 'Tous les vertébrés partagent', 1050, 350, .7, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'un ancêtre commun.', 1050, 390, .9, { size: 28, fill: COL.dim });
    const tx = G(p, { o: 0 });
    mk('circle', { cx: 1090, cy: 560, r: 14, fill: C_VIRUS }, tx);
    T(tx, 'Arbre de parenté', { x: 1122, y: 569, size: 30, fill: C_VIRUS, weight: 700 });
    T(tx, 'oiseaux = descendants des dinosaures', { x: 1122, y: 615, size: 26, fill: COL.dim });
    show(tx, m('start'), .6);
    text(p, 'L’Homme ne descend pas du singe : ils partagent un ancêtre commun.', 160, 640, 1.2, { size: 27, fill: COL.dim });
  }],
  ['n1', 'Preuves de la parenté', (m) => {
    const p = panel(0);
    text(p, 'Toutes les cellules ont de l’ADN', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, 'ADN universel', '+ ressemblances anatomiques', C_VIRUS, m('a'));
    pnum(p, 970, 260, 'Fossiles', '+ Archaeopteryx (plumes et dents)', C_VAC, m('b'));
    text(p, 'Ces indices prouvent que tous les êtres vivants ont une origine commune.', 800, 470, m('b', .6), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['n2', 'Sélection naturelle', (m) => {
    const p = panel(0);
    text(p, 'Le moteur de l’évolution', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    const row = chipsRow(p, [
      { t: 'Variations (mutations) au hasard', col: C_VIRUS },
      { t: 'Avantage → survie & reproduction', col: C_CAS },
      { t: 'Le caractère se transmet', col: C_EXTRA }
    ], 260, 330, { size: 27, gap: 80 });
    chipsIn(row, 0, m('c')); chipsIn(row, 1, m('c', .7)); chipsIn(row, 2, m('d'));
    text(p, 'Les papillons sombres survivent mieux sur des troncs', 800, 520, m('d', .9), { size: 28, fill: COL.dim, anchor: 'middle' });
    text(p, 'noircis par la suie (phalène du bouleau).', 800, 566, m('d', 1.2), { size: 28, fill: COL.dim, anchor: 'middle' });
  }],
  ['retenir', 'À retenir (B.O.)', (m) => {
    const p = panel(0);
    text(p, 'Le cœur du chapitre', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, 'Preuves', 'ADN universel + squelettes ressemblants', C_VAC, m('r1'));
    pnum(p, 970, 260, 'Sélection naturelle', 'les mieux adaptés transmettent', C_SEUIL, m('r2'));
    text(p, 'L’arbre de parenté classe les espèces selon les caractères partagés.', 800, 470, m('r2', .6), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['savoir', 'Le saviez-vous ?', (m) => {
    const p = panel(0);
    text(p, '98 % d’ADN commun', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    const n = T(p, 'avec le chimpanzé', { x: 800, y: 400, size: 44, fill: C_VIRUS, anchor: 'middle', weight: 700, o: 0 });
    put(n, { s: .2 }); pop(n, m('s'));
    text(p, 'Notre proche parenté avec les grands singes.', 800, 500, m('s', .6), { size: 30, fill: COL.dim, anchor: 'middle' });
  }],
  ['wrap', 'Bilan du chapitre', (m) => {
    const p = panel(0);
    [['L’universalité de la cellule et de l’ADN prouve que tous les êtres vivants ont une origine commune.', 'w1'],
     ['L’arbre de parenté classe les espèces selon les caractères partagés.', 'w2'],
     ['La sélection naturelle favorise les individus porteurs de caractères avantageux pour leur milieu.', 'w3'],
     ['L’être humain (Homo sapiens) est une espèce parmi d’autres au sein de l’arbre du vivant.', 'w4']].forEach(([str, mk_], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mk_), .6);
    });
  }],
  ['q1', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(BAND, [
    { id: 'c-girafe', prompt: ['Comment la théorie de Darwin explique-t-elle l’apparition d’un long cou chez les girafes ?'],
      build: choice([['Les girafes ont tellement tiré sur leur cou pour attraper les feuilles hautes que leur cou s’est allongé et s’est transmis ainsi.'], ['Dans une population avec des variations de longueur de cou dues au hasard, les individus à cou plus long accédaient à plus de nourriture, survivaient mieux et transmettaient leurs allèles favorables.'], ['Le climat a ordonné aux girafes de grandir instantanément.'], ['Toutes les girafes courtes ont décidé de se transformer en zèbres.']], 1,
        'C’est la sélection naturelle : la variabilité génétique préexistante est triée par l’environnement favorable à ceux qui ont un meilleur accès aux ressources.',
        [null, "C’est une idée de Lamarck (usage/désusage), pas de Darwin.", 'Les variations sont dues au hasard, pas à un ordre du climat.', 'Les individus ne transforment pas leur corps par la volonté.']) },
  ], done) }],
  ['q2', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(BAND, [
    { id: 'c-homme', prompt: ['L’Homme descend directement du chimpanzé actuel.'],
      build: choice([['VRAI'], ['FAUX']], 1,
        'Faux : l’Homme et le chimpanzé sont des espèces cousines qui partagent un ancêtre commun disparu ayant vécu il y a environ 7 millions d’années.',
        [null, 'L’Homme et le chimpanzé sont cousins, pas parent direct.', 'Ils partagent un ancêtre commun disparu.']) },
  ], done) }],
  ['finish', 'Terminé', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
