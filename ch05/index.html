<script>
'use strict';
const CHAPTER = { number: 5, title: 'Nutrition & organisation du vivant', minutes: 5, language: 'fr', next: '../ch06/' };

const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

const BEATS = [
  ['intro', 'TOPIC', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'SVT · Cycle 4 · Chapitre 2.1', { x: 800, y: 290, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Nutrition du', { x: 800, y: 420, size: 84, weight: 600, anchor: 'middle' });
    T(g, 'vivant', { x: 800, y: 520, size: 84, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const v = vxVirus(g, 1180, 300, 42, C_VIRUS);
    show(v, 1, .6);
    const r = text(scene, 'Animaux et végétaux ne se nourrissent pas de la même façon.', 800, 660, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(v, D - .9, .8);
  }],
  ['probleme', 'Deux modes de nutrition', (m) => {
    const p = panel(0);
    const card = mk('rect', { x: 110, y: 170, width: 880, height: 560, rx: 22, fill: COL.board, stroke: COL.faint, 'stroke-width': 2, opacity: 0 }, p);
    show(card, .1, .5);
    text(p, 'Chapitre 2.1 — Nutrition & organisation du vivant', 160, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    ['« Tous les êtres vivants sont formés de cellules et ont besoin', 'd’énergie pour grandir et fonctionner.', 'Mais les animaux et les végétaux', 'ne se nourrissent pas de la même façon. »'].forEach((l, i) => text(p, l, 160, 320 + i * 56, .5 + i * .25, { size: 36, fill: COL.chalk }));
    text(p, 'Nutrition animale :', 1050, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'glucose + dioxygène → énergie + CO2 + eau', 1050, 290, .45, { size: 24, fill: C_VIRUS, weight: 700 });
    text(p, 'Nutrition végétale :', 1050, 350, .7, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'lumière + eau + sels minéraux + CO2 → matière organique + O2', 1050, 410, .9, { size: 24, fill: C_SEUIL, weight: 700 });
    const tx = G(p, { o: 0 });
    mk('circle', { cx: 1090, cy: 560, r: 14, fill: C_VIRUS }, tx);
    T(tx, 'Autotrophe vs hétérotrophe', { x: 1122, y: 569, size: 30, fill: C_VIRUS, weight: 700 });
    T(tx, 'les plantes fabriquent leur nourriture', { x: 1122, y: 615, size: 26, fill: COL.dim });
    show(tx, m('start'), .6);
    text(p, 'Les stomates sont les petits pores des feuilles (échanges gazeux).', 160, 640, 1.2, { size: 27, fill: COL.dim });
  }],
  ['n1', 'Nutrition des animaux', (m) => {
    const p = panel(0);
    text(p, 'La respiration cellulaire', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, 'Glucose + O2', '→ énergie + CO2 + eau', C_VIRUS, m('a'));
    pnum(p, 970, 260, 'Cellules', 'consomment nutriments et dioxygène', C_VAC, m('b'));
    text(p, 'Le sang transporte les nutriments et l’O2 vers tous les organes ; poumons et reins éliminent les déchets.', 800, 470, m('b', .6), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['n2', 'Nutrition des plantes', (m) => {
    const p = panel(0);
    text(p, 'La photosynthèse', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    const row = chipsRow(p, [
      { t: 'Lumière + eau + sels minéraux + CO2', col: C_CAS },
      { t: '→ matière organique (sucres)', col: C_SEUIL },
      { t: '→ rejet de dioxygène (O2)', col: C_EXTRA }
    ], 260, 330, { size: 27, gap: 80 });
    chipsIn(row, 0, m('c')); chipsIn(row, 1, m('c', .7)); chipsIn(row, 2, m('d'));
    text(p, 'La sève brute monte des racines vers les feuilles ;', 800, 520, m('d', .9), { size: 28, fill: COL.dim, anchor: 'middle' });
    text(p, 'la sève élaborée, riche en sucres, nourrit toute la plante.', 800, 566, m('d', 1.2), { size: 28, fill: COL.dim, anchor: 'middle' });
  }],
  ['retenir', 'À retenir (B.O.)', (m) => {
    const p = panel(0);
    text(p, 'Deux équations à connaître', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, 'Animal', 'respiration cellulaire', C_VIRUS, m('r1'));
    pnum(p, 970, 260, 'Plante verte', 'photosynthèse', C_SEUIL, m('r2'));
    text(p, 'Les plantes stockent des réserves (amidon, sucres) dans les tubercules, bulbes et graines.', 800, 470, m('r2', .6), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['savoir', 'Le saviez-vous ?', (m) => {
    const p = panel(0);
    text(p, "Van Helmont et le saule", 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    text(p, 'Arrosé uniquement d’eau pendant 5 ans,', 800, 400, m('s'), { size: 30, fill: COL.chalk, anchor: 'middle' });
    text(p, 'le saule a pris plus de 70 kg alors que', 800, 450, m('s', .4), { size: 30, fill: COL.dim, anchor: 'middle' });
    text(p, 'la terre n’a presque rien perdu en poids.', 800, 500, m('s', .7), { size: 30, fill: COL.dim, anchor: 'middle' });
    text(p, 'Les plantes ne « mangent » pas la terre !', 800, 550, m('s', 1), { size: 30, fill: C_VIRUS, anchor: 'middle', weight: 700 });
  }],
  ['wrap', 'Bilan du chapitre', (m) => {
    const p = panel(0);
    [['Les animaux consomment des nutriments et du dioxygène pour produire de l’énergie (respiration cellulaire).', 'w1'],
     ['Les plantes vertes réalisent la photosynthèse grâce à la lumière, à l’eau, aux sels minéraux et au CO2.', 'w2'],
     ['La sève brute monte des racines et la sève élaborée nourrit tous les organes de la plante.', 'w3'],
     ['Les plantes stockent des réserves nutritives (bulbes, tubercules, graines) pour passer l’hiver.', 'w4']].forEach(([str, mk_], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mk_), .6);
    });
  }],
  ['q1', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'c-photosynthese', prompt: ['Quels sont les éléments indispensables pour que la photosynthèse ait lieu ?'],
      build: choice([['L’obscurité totale, de la viande et de l’azote.'], ['De la lumière, du dioxyde de carbone (CO2), de l’eau et des sels minéraux.'], ['Uniquement du dioxygène et du sucre.'], ['Un apport permanent d’engrais chimique sans lumière.']], 1,
        'La photosynthèse utilise l’énergie lumineuse captée par la chlorophylle pour transformer eau, sels minéraux et CO2 en matière organique, en rejetant du dioxygène.',
        [null, 'La photosynthèse a besoin de lumière, pas d’obscurité.', 'La chlorophylle transforme l’énergie lumineuse en matière organique.', 'L’engrais aide, mais il ne remplace pas la lumière et le CO2.']) },
  ], done) }],
  ['q2', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'c-seve', prompt: ['La sève élaborée est produite au niveau des racines et ne contient que de l’eau pure.'],
      build: choice([['VRAI'], ['FAUX']], 1,
        'La sève brute monte des racines (eau + sels minéraux). La sève élaborée est produite dans les feuilles par photosynthèse et est riche en matière organique (sucres).',
        [null, "C’est la sève brute qui vient des racines.", 'La sève élaborée contient les sucres fabriqués par les feuilles.']) },
  ], done) }],
  ['finish', 'Terminé', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
