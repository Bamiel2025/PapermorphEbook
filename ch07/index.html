<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Génétique : diversité & stabilité — Ebook SVT Cycle 4</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">

  .screen .grid.text .row { grid-template-columns: minmax(0, 1fr) auto 40px; }

  .side .grid .row { grid-template-columns: 70px minmax(0, 1fr) 34px; }
  .side .grid .why { padding-left: 86px; }

<body>
<script src="../lib/engine.js"></script>
<script src="../lib/lang-fr.js"></script>
<script src="../lib/vocab.js"></script>
<script src="audio/fr/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 7, title: 'Génétique : diversité & stabilité', minutes: 6, language: 'fr', next: '../ch08/' };

const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

const BEATS = [
  ['intro', 'TOPIC', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'SVT · Cycle 4 · Chapitre 2.3', { x: 800, y: 290, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Génétique', { x: 800, y: 420, size: 84, weight: 600, anchor: 'middle' });
    T(g, 'diversité & stabilité', { x: 800, y: 520, size: 84, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const v = vxVirus(g, 1180, 300, 42, C_VIRUS);
    show(v, 1, .6);
    const r = text(scene, 'Pourquoi ressemblons-nous à nos parents sans être des copies conformes ?', 800, 660, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(v, D - .9, .8);
  }],
  ['probleme', 'Hérédité et caractères', (m) => {
    const p = panel(0);
    const card = mk('rect', { x: 110, y: 170, width: 880, height: 560, rx: 22, fill: COL.board, stroke: COL.faint, 'stroke-width': 2, opacity: 0 }, p);
    show(card, .1, .5);
    text(p, 'Chapitre 2.3 — Génétique : diversité & stabilité', 160, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    ['« Pourquoi ressemblons-nous à nos parents sans être', 'des copies conformes ? L’étude de la génétique', 'permet de comprendre comment nos caractères physiques', 'sont transmis de génération en génération. »'].forEach((l, i) => text(p, l, 160, 320 + i * 56, .5 + i * .25, { size: 36, fill: COL.chalk }));
    text(p, '23 paires de chromosomes (46)', 1050, 230, .3, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'dans le noyau de chaque cellule', 1050, 290, .45, { size: 28, fill: COL.dim });
    text(p, 'ADN = double hélice', 1050, 330, .7, { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'XX (femme) / XY (homme)', 1050, 390, .9, { size: 28, fill: COL.dim });
    const tx = G(p, { o: 0 });
    mk('circle', { cx: 1090, cy: 560, r: 14, fill: C_VIRUS }, tx);
    T(tx, 'Allèles dominants / récessifs', { x: 1122, y: 569, size: 30, fill: C_VIRUS, weight: 700 });
    T(tx, 'exemple : groupe sanguin A sur O', { x: 1122, y: 615, size: 26, fill: COL.dim });
    show(tx, m('start'), .6);
    text(p, 'Un gène donne un caractère ; les allèles en sont les différentes versions.', 160, 640, 1.2, { size: 27, fill: COL.dim });
  }],
  ['n1', 'Chromosomes et ADN', (m) => {
    const p = panel(0);
    text(p, 'Le plan de fabrication du corps', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, '23 paires', 'de chromosomes (46 au total)', C_VIRUS, m('a'));
    pnum(p, 970, 260, 'ADN', 'double hélice, instructions de l’organisme', C_VAC, m('b'));
    text(p, 'Une anomalie du nombre de chromosomes peut exister (ex. : trisomie 21).', 800, 470, m('b', .6), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['n2', 'Gènes et allèles', (m) => {
    const p = panel(0);
    text(p, 'Les recettes de nos caractères', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    const row = chipsRow(p, [
      { t: 'Gène : détermine un caractère', col: C_CAS },
      { t: 'Allèle : une version du gène', col: C_SEUIL },
      { t: 'Dominant sur récessif : A sur O', col: C_EXTRA }
    ], 260, 330, { size: 27, gap: 80 });
    chipsIn(row, 0, m('c')); chipsIn(row, 1, m('c', .7)); chipsIn(row, 2, m('d'));
    text(p, 'Nous possédons deux allèles par gène (un du père, un de la mère).', 800, 520, m('d', .9), { size: 28, fill: COL.dim, anchor: 'middle' });
    text(p, 'Allèles A et O → groupe sanguin A.', 800, 566, m('d', 1.2), { size: 28, fill: COL.dim, anchor: 'middle' });
  }],
  ['retenir', 'À retenir (B.O.)', (m) => {
    const p = panel(0);
    text(p, 'Le cœur du chapitre', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    pnum(p, 330, 260, 'Chromosomes', '23 paires · ADN · XX / XY', C_VAC, m('r1'));
    pnum(p, 970, 260, 'Gène & allèle', 'caractère → version (dominant / récessif)', C_SEUIL, m('r2'));
    text(p, 'Les gamètes ont 23 chromosomes ; la fécondation au hasard crée un être humain unique.', 800, 470, m('r2', .6), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['savoir', 'Le saviez-vous ?', (m) => {
    const p = panel(0);
    text(p, 'L’ADN se déroule', 800, 110, .2, { size: 42, anchor: 'middle', weight: 600 });
    const n = T(p, '≈ 2 mètres', { x: 800, y: 400, size: 96, fill: C_VIRUS, anchor: 'middle', weight: 700, o: 0 });
    put(n, { s: .2 }); pop(n, m('s'));
    text(p, 'Longueur de l’ADN d’une seule cellule humaine, une fois déroulé.', 800, 540, m('s', .6), { size: 30, fill: COL.dim, anchor: 'middle' });
  }],
  ['wrap', 'Bilan du chapitre', (m) => {
    const p = panel(0);
    [['L’être humain possède 23 paires de chromosomes (46 au total) dans le noyau des cellules.', 'w1'],
     ['L’ADN forme les chromosomes et porte les gènes qui déterminent nos caractères.', 'w2'],
     ['Les allèles sont les différentes versions d’un gène (dominants ou récessifs).', 'w3'],
     ['Chaque gamète contient 23 chromosomes ; la fécondation au hasard crée un être humain unique.', 'w4']].forEach(([str, mk_], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mk_), .6);
    });
  }],
  ['q1', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'c-groupe', prompt: ['Un enfant possède pour le gène du groupe sanguin l’allèle A sur un chromosome et l’allèle O sur l’autre. Quel sera son groupe sanguin (phénotype) ?'],
      build: choice([['Groupe O, car O annule les autres allèles.'], ['Groupe A, car l’allèle A est dominant sur l’allèle O qui est récessif.'], ['Groupe AO, un groupe intermédiaire nouveau.'], ['Groupe B par mutation spontanée.']], 1,
        'L’allèle A est dominant et l’allèle O est récessif : le phénotype exprimé est donc le groupe A.',
        [null, 'O est récessif : il ne s’exprime pas en présence de A.', 'A est dominant : il s’exprime toujours.', 'AO n’est pas un groupe sanguin intermédiaire ici.']) },
  ], done) }],
  ['q2', 'Vérification rapide', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'c-gamete', prompt: ['Un spermatozoïde humain normal contient 46 chromosomes complets.'],
      build: choice([['VRAI'], ['FAUX']], 1,
        'Faux : un gamète (spermatozoïde ou ovule) contient 23 chromosomes simples (un seul de chaque paire) suite à la méiose.',
        [null, 'Les cellules du corps ont 46 chromosomes ; les gamètes en ont 23.', 'La méiose divise le nombre de chromosomes par deux.']) },
  ], done) }],
  ['finish', 'Terminé', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
